<svg xmlns="http://www.w3.org/2000/svg" width="960" height="324" viewBox="0 0 960 324" role="img" aria-labelledby="title desc">
<title>reviewloop demo</title>
<desc>Drive every PR reviewer to a clear state.</desc>
<rect width="960" height="324" rx="18" fill="#f8fafc"/>
<rect x="28" y="28" width="904" height="268" rx="16" fill="#111827"/>
<rect x="28" y="28" width="904" height="10" rx="5" fill="#8b5cf6"/>
<circle cx="62" cy="64" r="7" fill="#fb7185"/>
<circle cx="86" cy="64" r="7" fill="#facc15"/>
<circle cx="110" cy="64" r="7" fill="#34d399"/>
<text x="142" y="70" font-family="Arial" font-size="18" font-weight="700" fill="#f9fafb" text-anchor="start">reviewloop</text>
<text x="142" y="96" font-family="Arial" font-size="13" font-weight="400" fill="#9ca3af" text-anchor="start">Drive every PR reviewer to a clear state.</text>
<text x="62" y="136" font-family="Menlo" font-size="17" font-weight="700" fill="#f9fafb" text-anchor="start">$ reviewloop this PR</text>
<text x="62" y="178" font-family="Menlo" font-size="16" font-weight="700" fill="#8b5cf6" text-anchor="start">PR</text>
<text x="206" y="178" font-family="Menlo" font-size="16" font-weight="400" fill="#e5e7eb" text-anchor="start">#5876 on feature/auth-boundaries</text>
<text x="62" y="206" font-family="Menlo" font-size="16" font-weight="700" fill="#8b5cf6" text-anchor="start">Reviewers</text>
<text x="206" y="206" font-family="Menlo" font-size="16" font-weight="400" fill="#e5e7eb" text-anchor="start">greptile-apps, coderabbitai, Copilot, @neeraj</text>
<text x="62" y="234" font-family="Menlo" font-size="16" font-weight="700" fill="#8b5cf6" text-anchor="start">Action</text>
<text x="206" y="234" font-family="Menlo" font-size="16" font-weight="400" fill="#e5e7eb" text-anchor="start">fix 11 threads, reply to humans, resolve addressed comments</text>
<text x="62" y="262" font-family="Menlo" font-size="16" font-weight="700" fill="#8b5cf6" text-anchor="start">Bots</text>
<text x="206" y="262" font-family="Menlo" font-size="16" font-weight="400" fill="#e5e7eb" text-anchor="start">re-trigger Greptile, CodeRabbit, and Copilot review</text>
<text x="62" y="290" font-family="Menlo" font-size="16" font-weight="700" fill="#8b5cf6" text-anchor="start">Exit</text>
<text x="206" y="290" font-family="Menlo" font-size="16" font-weight="400" fill="#e5e7eb" text-anchor="start">0 bot threads left; waiting on human re-review</text>
<rect x="62" y="324" width="836" height="1" fill="#374151"/>
<text x="62" y="358" font-family="Arial" font-size="13" font-weight="400" fill="#9ca3af" text-anchor="start">agent-skills by BiswaViraj</text>
</svg>
