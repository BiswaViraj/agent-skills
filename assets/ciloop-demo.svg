<svg xmlns="http://www.w3.org/2000/svg" width="960" height="324" viewBox="0 0 960 324" role="img" aria-labelledby="title desc">
<title>ciloop demo</title>
<desc>Turn red GitHub Actions into a local fix loop.</desc>
<rect width="960" height="324" rx="18" fill="#f8fafc"/>
<rect x="28" y="28" width="904" height="268" rx="16" fill="#111827"/>
<rect x="28" y="28" width="904" height="10" rx="5" fill="#10a37f"/>
<circle cx="62" cy="64" r="7" fill="#fb7185"/>
<circle cx="86" cy="64" r="7" fill="#facc15"/>
<circle cx="110" cy="64" r="7" fill="#34d399"/>
<text x="142" y="70" font-family="Arial" font-size="18" font-weight="700" fill="#f9fafb" text-anchor="start">ciloop</text>
<text x="142" y="96" font-family="Arial" font-size="13" font-weight="400" fill="#9ca3af" text-anchor="start">Turn red GitHub Actions into a local fix loop.</text>
<text x="62" y="136" font-family="Menlo" font-size="17" font-weight="700" fill="#f9fafb" text-anchor="start">$ ciloop</text>
<text x="62" y="178" font-family="Menlo" font-size="16" font-weight="700" fill="#10a37f" text-anchor="start">Run</text>
<text x="206" y="178" font-family="Menlo" font-size="16" font-weight="400" fill="#e5e7eb" text-anchor="start">Unit Tests / head sha 9fd32c1</text>
<text x="62" y="206" font-family="Menlo" font-size="16" font-weight="700" fill="#10a37f" text-anchor="start">Failure</text>
<text x="206" y="206" font-family="Menlo" font-size="16" font-weight="400" fill="#e5e7eb" text-anchor="start">auth.spec.ts assertion + one TypeScript error</text>
<text x="62" y="234" font-family="Menlo" font-size="16" font-weight="700" fill="#10a37f" text-anchor="start">Local</text>
<text x="206" y="234" font-family="Menlo" font-size="16" font-weight="400" fill="#e5e7eb" text-anchor="start">pnpm test auth.spec.ts &amp;&amp; pnpm typecheck</text>
<text x="62" y="262" font-family="Menlo" font-size="16" font-weight="700" fill="#10a37f" text-anchor="start">Fix</text>
<text x="206" y="262" font-family="Menlo" font-size="16" font-weight="400" fill="#e5e7eb" text-anchor="start">update mock claims, add missing import</text>
<text x="62" y="290" font-family="Menlo" font-size="16" font-weight="700" fill="#10a37f" text-anchor="start">Exit</text>
<text x="206" y="290" font-family="Menlo" font-size="16" font-weight="400" fill="#e5e7eb" text-anchor="start">new run is green</text>
<rect x="62" y="324" width="836" height="1" fill="#374151"/>
<text x="62" y="358" font-family="Arial" font-size="13" font-weight="400" fill="#9ca3af" text-anchor="start">agent-skills by BiswaViraj</text>
</svg>
